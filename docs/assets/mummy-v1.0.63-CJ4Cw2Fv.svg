<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Bandage Glow & Shading -->
    <linearGradient id="mummyBandage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="pharaohGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="pharaohLapis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>
    <filter id="mummyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.8" />
    </filter>
    <filter id="auraGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow behind character -->
  <circle cx="32" cy="32" r="28" fill="#d97706" opacity="0.15" filter="url(#auraGlow)" />

  <g filter="url(#mummyShadow)">
    <!-- Pharaoh Nemes / Headcloth Back flaps -->
    <path d="M18 16 L12 36 L20 34 L21 24 Z" fill="url(#pharaohGold)" stroke="#78350f" stroke-width="0.8" />
    <path d="M46 16 L52 36 L44 34 L43 24 Z" fill="url(#pharaohGold)" stroke="#78350f" stroke-width="0.8" />
    
    <!-- Nemes stripes left -->
    <path d="M17 20 L13 25 L19 24 Z" fill="url(#pharaohLapis)" />
    <path d="M15 28 L12 33 L18 31 Z" fill="url(#pharaohLapis)" />

    <!-- Nemes stripes right -->
    <path d="M47 20 L51 25 L45 24 Z" fill="url(#pharaohLapis)" />
    <path d="M49 28 L52 33 L46 31 Z" fill="url(#pharaohLapis)" />

    <!-- Mummy Body / Torso -->
    <path d="M22 34 L42 34 L45 52 L19 52 Z" fill="#b45309" />

    <!-- Torso Bandages (Criss-cross wraps) -->
    <path d="M20 36 L43 42 L42 45 L19 39 Z" fill="#fef3c7" opacity="0.9" />
    <path d="M44 36 L21 43 L20 46 L43 39 Z" fill="#fde68a" opacity="0.85" />
    <path d="M19 44 L44 48 L43 51 L18 47 Z" fill="#fef3c7" opacity="0.9" />
    <path d="M44 45 L20 50 L19 53 L43 48 Z" fill="#fef08a" opacity="0.85" />

    <!-- Royal Collar (Usekh) -->
    <path d="M22 34 Q32 44 42 34 Q32 30 22 34 Z" fill="url(#pharaohGold)" stroke="#854d0e" stroke-width="0.6" />
    <!-- Scarab / Gem in Center of Collar -->
    <ellipse cx="32" cy="35" rx="3.5" ry="2.5" fill="url(#pharaohLapis)" stroke="#fde047" stroke-width="0.5" />

    <!-- Hanging Bandage Wraps Ends -->
    <path d="M20 48 Q15 54 18 60 Q21 57 22 52 Z" fill="#fef3c7" opacity="0.85" />
    <path d="M43 49 Q48 56 46 61 Q43 57 42 53 Z" fill="#fde68a" opacity="0.85" />
    <path d="M29 51 Q31 58 30 62 Q28 58 28 52 Z" fill="#fef08a" opacity="0.8" />

    <!-- Mummy Head -->
    <ellipse cx="32" cy="22" rx="12" ry="13" fill="#78350f" stroke="#451a03" stroke-width="0.8" />

    <!-- Pharaoh Crown / Uraeus Peak -->
    <path d="M20 18 Q32 9 44 18 Q32 14 20 18 Z" fill="url(#pharaohGold)" stroke="#854d0e" stroke-width="0.7" />
    <!-- Cobra Uraeus on forehead -->
    <path d="M31 10 Q32 7 33 10 Q34 13 32 15 Q30 13 31 10 Z" fill="#38bdf8" stroke="#fde047" stroke-width="0.5" />
    <circle cx="32" cy="8" r="1.5" fill="#fde047" />

    <!-- Head Linen Wraps -->
    <path d="M21 17 Q32 14 43 17 L42 20 Q32 17 22 20 Z" fill="#fef3c7" opacity="0.95" />
    <path d="M20 20 Q32 24 44 20 L44 23 Q32 27 20 23 Z" fill="#fde68a" opacity="0.9" />
    <path d="M21 28 Q32 25 43 28 L42 32 Q32 29 22 32 Z" fill="#fef3c7" opacity="0.95" />
    <path d="M22 31 Q32 35 42 31 L41 34 Q32 38 23 34 Z" fill="#fde68a" opacity="0.9" />

    <!-- Eye Sockets (Dark ancient void) -->
    <rect x="23.5" y="22" width="6.5" height="4.5" rx="2" fill="#0f172a" />
    <rect x="34" y="22" width="6.5" height="4.5" rx="2" fill="#0f172a" />

    <!-- Glowing Cyan Mummy Eyes -->
    <ellipse cx="26.8" cy="24.2" rx="2.5" ry="1.8" fill="#22d3ee" filter="url(#auraGlow)" />
    <circle cx="26.8" cy="24.2" r="1.2" fill="#ffffff" />

    <ellipse cx="37.2" cy="24.2" rx="2.5" ry="1.8" fill="#22d3ee" filter="url(#auraGlow)" />
    <circle cx="37.2" cy="24.2" r="1.2" fill="#ffffff" />

    <!-- Eye Glow Halos -->
    <circle cx="26.8" cy="24.2" r="4" fill="url(#eyeGlow)" />
    <circle cx="37.2" cy="24.2" r="4" fill="url(#eyeGlow)" />

    <!-- Chin Pharaoh Beard (Osiris false beard) -->
    <path d="M30 33 L34 33 L33 41 L31 41 Z" fill="url(#pharaohGold)" stroke="#854d0e" stroke-width="0.5" />
    <line x1="30.5" y1="36" x2="33.5" y2="36" stroke="#0284c7" stroke-width="0.8" />
    <line x1="31" y1="39" x2="33" y2="39" stroke="#0284c7" stroke-width="0.8" />
  </g>
</svg>
